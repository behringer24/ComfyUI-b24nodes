# Metadata for the ComfyUI Registry (https://docs.comfy.org/registry/overview).
[project]
name = "comfyui-b24nodes"
version = "0.2.0"
description = "Custom ComfyUI nodes by b24: load images from any sub folder of ComfyUI/input, turn an aspect ratio plus a megapixel budget into a width/height pair, compose prompts from templates with {{placeholders}}, pick colors by name, and apply several LoRAs at once."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Andreas Behringer" }]
keywords = ["comfyui", "comfyui-nodes", "image", "loader", "resolution", "aspect-ratio", "prompt", "template", "color", "lora"]
# No extra dependencies: torch, numpy, Pillow and aiohttp ship with ComfyUI.
dependencies = []

[project.urls]
Repository = "https://github.com/behringer24/ComfyUI-b24nodes"

[tool.comfy]
# TODO: set the publisher id of the ComfyUI registry account before publishing.
PublisherId = ""
DisplayName = "ComfyUI-b24nodes"
Icon = ""
